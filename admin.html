<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Bros K Ventures</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="admin-page">

    <header class="admin-header">

        <div class="admin-header-inner">

            <div class="admin-dashboard-brand">

                <img
                    src="images/logo/bk-logo.png"
                    alt="Bros K Ventures logo"
                >

                <div>
                    <h1>Bros K Ventures</h1>
                    <p>Admin Dashboard</p>
                </div>

            </div>

            <button
                id="admin-logout-btn"
                class="admin-logout-btn"
                type="button"
            >
                Sign Out
            </button>

        </div>

    </header>


    <main class="admin-dashboard">

        <section class="admin-dashboard-heading">

            <p class="section-label">
                CUSTOMER INQUIRIES
            </p>

            <h2>Quote Requests</h2>

            <p>
                Manage quote requests submitted through the
                Bros K Ventures website.
            </p>

        </section>


        <section class="admin-summary">

            <div class="admin-summary-card">
                <span>Total Requests</span>
                <strong id="total-requests">0</strong>
            </div>

            <div class="admin-summary-card">
                <span>Unread</span>
                <strong id="unread-requests">0</strong>
            </div>

            <div class="admin-summary-card">
                <span>Archived</span>
                <strong id="archived-requests">0</strong>
            </div>

        </section>


        <section class="admin-controls">

            <input
                type="search"
                id="quote-search"
                placeholder="Search name, email, phone, service..."
                aria-label="Search quote requests"
            >

            <select
                id="quote-status-filter"
                aria-label="Filter quote requests by status"
            >
                <option value="All">All Statuses</option>
                <option value="New">New</option>
                <option value="Contacted">Contacted</option>
                <option value="Quote Sent">Quote Sent</option>
                <option value="Approved">Approved</option>
                <option value="Closed">Closed</option>
            </select>

            <label class="admin-archive-filter">
                <input
                    type="checkbox"
                    id="show-archived"
                >
                Show archived
            </label>

        </section>


        <div
            id="admin-dashboard-status"
            class="admin-dashboard-status"
        >
            Loading quote requests...
        </div>


        <section
            id="quote-list"
            class="admin-quote-list"
        >
        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/admin.js"></script>

</body>

</html>
