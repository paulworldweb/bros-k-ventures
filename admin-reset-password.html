<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Reset Admin Password | Bros K Ventures
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="admin-page">


    <main class="admin-login-section">


        <section class="admin-login-card">


            <div class="admin-brand">

                <img
                    src="images/logo/bk-logo.png"
                    alt="Bros K Ventures logo"
                >

                <div>

                    <h1>
                        Bros K Ventures
                    </h1>

                    <p>
                        ADMIN PORTAL
                    </p>

                </div>

            </div>


            <div id="reset-password-area">


                <div class="admin-login-heading">

                    <h2>
                        Create New Password
                    </h2>

                    <p>
                        Enter a new password for your
                        Bros K Ventures admin account.
                    </p>

                </div>


                <form id="reset-password-form">


                    <div class="admin-form-group">

                        <label
                            for="reset-new-password"
                        >
                            New Password
                        </label>

                        <input
                            type="password"
                            id="reset-new-password"
                            placeholder="Enter new password"
                            minlength="8"
                            required
                        >

                    </div>


                    <div class="admin-form-group">

                        <label
                            for="reset-confirm-password"
                        >
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="reset-confirm-password"
                            placeholder="Enter password again"
                            minlength="8"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="admin-login-btn"
                    >
                        Update Password
                    </button>


                    <div
                        id="reset-password-status"
                        class="admin-login-status"
                    ></div>


                </form>

            </div>


        </section>


    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script
        src="js/admin-reset-password.js"
    ></script>


</body>

</html>
