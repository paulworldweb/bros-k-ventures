<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Bros K Ventures</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="admin-page">

    <main class="admin-login-section">

        <div class="admin-login-card">

            <a href="index.html" class="admin-brand">

                <img
                    src="images/logo/bk-logo.png"
                    alt="Bros K Ventures logo"
                >

                <div>
                    <h1>Bros K Ventures</h1>
                    <p>Admin Portal</p>
                </div>

            </a>


            <!-- NORMAL ADMIN LOGIN -->
            <div id="normal-login-area">

                <div class="admin-login-heading">

                    <h2>Admin Sign In</h2>

                    <p>
                        Sign in to manage customer quote requests.
                    </p>

                </div>


                <form id="admin-login-form">

                    <div class="admin-form-group">

                        <label for="admin-email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="admin-email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="admin-form-group">

                        <label for="admin-password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="admin-password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="admin-login-btn"
                    >
                        Sign In
                    </button>


                    <div
                        id="admin-login-status"
                        class="admin-login-status"
                        aria-live="polite"
                    ></div>

                </form>

            </div>


            <!-- FIRST-TIME INVITED ADMIN -->
            <div
                id="password-setup-area"
                style="display: none;"
            >

                <div class="admin-login-heading">

                    <h2>Create Your Password</h2>

                    <p>
                        Create a password for your
                        Bros K Ventures admin account.
                    </p>

                </div>


                <form id="password-setup-form">

                    <div class="admin-form-group">

                        <label for="new-admin-password">
                            New Password
                        </label>

                        <input
                            type="password"
                            id="new-admin-password"
                            placeholder="Create a password"
                            minlength="8"
                            required
                        >

                    </div>


                    <div class="admin-form-group">

                        <label for="confirm-admin-password">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm-admin-password"
                            placeholder="Enter the password again"
                            minlength="8"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="admin-login-btn"
                    >
                        Create Password
                    </button>


                    <div
                        id="password-setup-status"
                        class="admin-login-status"
                        aria-live="polite"
                    ></div>

                </form>

            </div>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/admin.js"></script>

</body>

</html>
